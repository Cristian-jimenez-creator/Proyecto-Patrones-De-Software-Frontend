spring.application.name=pool-safety-frontend

# The backend defaults to 8080, so the frontend uses 8081
server.port=${SERVER_PORT:8081}
vaadin.launch-browser=false

# Backend (configured only through environment variables)
poolsafety.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
poolsafety.backend.connect-timeout=2s
poolsafety.backend.read-timeout=5s

# Strict CSP by default; the dev profile relaxes it for the Vaadin dev server
poolsafety.security.relaxed-csp-for-development=false

# Session and cookies
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Never expose error details to the client
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
