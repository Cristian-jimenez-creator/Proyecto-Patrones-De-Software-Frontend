<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1728"><title>Iniciar sesión · Smart Pool</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark login-mark">S</div>
    <div class="eyebrow">SMART POOL SECURITY</div>
    <h1>Inicia sesión</h1>
    <p>Accede al centro de seguridad de piscinas.</p>
    <div id="login-error" class="login-error" hidden>Usuario o contraseña incorrectos. Inténtalo otra vez.</div>
    <div id="logged-out" class="login-note" hidden>Sesión cerrada correctamente.</div>
    <form id="login-form">
      <label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-button" type="submit">Entrar <span>→</span></button>
    </form>
    <small>Smart Pool · Panel de monitoreo</small>
  </main>
  <script src="/assets/login.js" defer></script>
</body>
</html>
