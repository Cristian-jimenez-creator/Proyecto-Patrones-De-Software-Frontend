<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1728">
  <title>Crear cuenta · Smart Pool</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/config.js"></script>
</head>
<body class="login-page">
  <main class="login-card register-card">
    <div class="brand-mark login-mark">S</div>
    <div class="eyebrow">SMART POOL SECURITY</div>
    <h1>Crear una cuenta</h1>
    <p>Regístrate para acceder al centro de seguridad de piscinas.</p>
    <div id="register-message" class="login-note" role="status" aria-live="polite" hidden></div>
    <form id="register-form">
      <label for="name">Nombre completo</label>
      <input id="name" name="name" autocomplete="name" maxlength="120" required>
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
      <small class="password-hint">Usa al menos 12 caracteres.</small>
      <label for="password-confirmation">Confirmar contraseña</label>
      <input id="password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
      <button id="register-button" type="submit">Crear cuenta</button>
    </form>
    <div class="auth-switch">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></div>
    <small>Smart Pool · Panel de monitoreo</small>
  </main>
  <script src="/assets/register.js" defer></script>
</body>
</html>
